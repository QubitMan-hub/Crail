<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#e9e3d6" />
    <meta name="description" content="CRAIL: a game that started as one cube. Instagram comments decide everything else." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>CRAIL</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="vignette"></div>
    <div id="brand" class="hud">
      <h1>CRAIL</h1>
      <button id="day" type="button" aria-expanded="false" aria-controls="credits">Day 0</button>
    </div>
    <ul id="credits" hidden></ul>
    <button id="sound" type="button">Sound on</button>
    <div id="hint" class="hud">
      <span class="keys">WASD or arrow keys to roll. Click to go there.</span>
      <span class="touch">Tap anywhere to roll there.</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
